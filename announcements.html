<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Announcements</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="screen announcements">

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Campus Connect Hub</h1>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="add.html">Add Resource</a></li>
        <li><a href="announcements.html">Announcements</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- =============================== -->
    <!-- ADMIN LOGIN -->
    <!-- =============================== -->
    <div id="adminLoginBox">
      <input type="password" id="adminPassword" placeholder="Enter admin password">
      <button type="button" onclick="loginAdmin()">Login</button>
      <p id="adminStatus"></p>
    </div>

    <!-- =============================== -->
    <!-- ANNOUNCEMENT FORM -->
    <!-- =============================== -->
    <section class="announcement-form-section">

      <div class="announcement-form-container">

        <h2>Share Announcement</h2>

        <p class="announcement-subtitle">
          Post important academic updates for students.
        </p>

        <form id="announcementForm" style="display:none;">

          <input
            type="text"
            id="announcementTitle"
            placeholder="Enter Announcement Title"
            required
          >

          <textarea
            id="announcementMessage"
            placeholder="Write your announcement here..."
            required
          ></textarea>

          <button type="submit">
            Post Announcement
          </button>

        </form>

        <p id="announcementMessageBox"></p>

      </div>

    </section>

    <!-- DISPLAY -->
    <section class="announcement-section">

      <h2>Latest Announcements</h2>

      <div id="announcementContainer"></div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Campus Connect Hub | Education is life</p>
  </footer>

  <!--  FIXED SCRIPT LINK -->
  <script src="js/announcements.js"></script>

</body>
</html>
