<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Announcements | Campus Connect Hub</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body class="screen announcements">

  <!-- HEADER -->

  <header>

    <nav>

      <h1>Campus Connect Hub</h1>

      <ul>

        <li><a href="index.html">Home</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="announcements.html">Announcements</a></li>
        <li><a href="chat.html">Chat</a></li>

      </ul>

    </nav>

  </header>

  <!-- LOGIN -->

  <div id="loginBox">

    <h3>Login</h3>

    <input type="password" id="loginPassword">

    <button onclick="loginUser('teacher')">Teacher Login</button>

    <button onclick="loginUser('student')">Student Login</button>

    <p id="loginStatus"></p>

  </div>

  <!-- FORM -->

  <section>

    <form id="announcementForm">

      <input id="announcementTitle" placeholder="Title">

      <textarea id="announcementMessage" placeholder="Message"></textarea>

      <button type="button" onclick="addAnnouncement()">
        Post
      </button>

    </form>

  </section>

  <!-- DISPLAY -->

  <section>

    <div id="announcementContainer"></div>

  </section>

  <script src="js/script.js"></script>

</body>

</html>
