<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Campus Connect Hub</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="screen chat">

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Campus Connect Hub</h1>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="announcements.html">Announcements</a></li>
        <li><a href="chat.html">Chat</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- ROLE SELECT -->
    <section>
      <h2>Join Chat</h2>

      <select id="chatRole">
        <option value="student">Student</option>
        <option value="tutor">Tutor</option>
      </select>

      <input id="chatName" placeholder="Your name">
    </section>

    <!-- CHAT BOX -->
    <section>

      <div id="chatBox" class="chat-box"></div>

      <form id="chatForm">
        <input id="chatMessage" placeholder="Type message..." required>
        <button type="submit">Send</button>
      </form>

    </section>

  </main>

  <footer>
    <p>© 2026 Campus Connect Hub</p>
  </footer>

  <script src="js/script.js"></script>

</body>
</html>
